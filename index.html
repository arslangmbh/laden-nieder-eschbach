<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Laden Nieder-Eschbach</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root{
      --yellow:#f6d64a;
      --dark:#222;
      --light:#f6f6f6;
      --border:#e6e6e6;
    }

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--dark);
      line-height:1.6;
      background:#fff;
    }

    /* UPDATED HEADER: banner + logo */
    header{
      background:var(--yellow);
      padding:18px 20px;
    }
    .brand{
      max-width:1000px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .brand svg{
      width:min(640px, 100%);
      height:auto;
      display:block;
    }

    .container{
      max-width:1000px;
      margin:0 auto;
      padding:20px;
    }

    .hero{
      display:grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap:26px;
      align-items:center;
      margin:18px 0 34px;
    }

    .hero img{
      width:100%;
      height:auto;
      border-radius:10px;
      border:1px solid var(--border);
      display:block;
    }

    .box{
      background:var(--light);
      padding:20px;
      border-radius:10px;
      margin-bottom:26px;
      border:1px solid var(--border);
    }

    h2{ margin:0 0 10px; }

    .opening-times p{
      margin:6px 0;
    }

    .map-wrap{
      border-radius:10px;
      overflow:hidden;
      border:1px solid var(--border);
      background:#fff;
    }

    iframe{
      width:100%;
      height:340px;
      border:0;
      display:block;
    }

    .cta{
      margin-top:14px;
    }

      display:inline-block;

      color:#000;
      padding:10px 14px;
      border-radius:8px;
      text-decoration:none;
      font-weight:bold;
      border:1px solid rgba(0,0,0,.08);
    }
